<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020810">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="JARVIS">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{
  --bg:#020810;--b1:#00C8FF;--b2:#00FFE0;--b3:#0060CC;
  --dim:rgba(0,200,255,0.12);--border:rgba(0,200,255,0.22);
  --td:rgba(0,200,255,0.4);
  --font:'Orbitron',monospace;--font2:'Exo 2',sans-serif;
}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--b1);font-family:var(--font2)}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;overflow:hidden}

/* ── PARTICLE BG ── */
#bgc{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.6}

/* ── HUD TOP ── */
#hud{
  display:flex;justify-content:space-between;align-items:center;
  padding:max(12px,env(safe-area-inset-top,12px)) 16px 10px;
  border-bottom:1px solid var(--border);
  background:rgba(2,8,16,0.9);backdrop-filter:blur(12px);
  flex-shrink:0;z-index:10;position:relative;
}
.hi{font-family:var(--font);font-size:11px;color:var(--b2);letter-spacing:3px}
.hs{font-family:var(--font);font-size:7px;color:var(--td);letter-spacing:2px;margin-top:2px}
#badge{
  font-family:var(--font);font-size:8px;letter-spacing:2px;
  padding:4px 10px;border:1px solid var(--border);
  background:var(--dim);transition:all 0.4s;white-space:nowrap;
}
#badge.on{color:var(--b2);border-color:var(--b2);box-shadow:0 0 8px rgba(0,255,224,0.25)}
#clk{font-family:var(--font);font-size:13px;text-align:right}
#vtl{font-family:var(--font);font-size:7px;color:var(--td);text-align:right;margin-top:3px;letter-spacing:1px}

/* ── STAGE ── */
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1;min-height:0;padding:8px 0}

/* ── REACTOR WRAP ── */
#rw{
  position:relative;
  width:min(64vw,280px);height:min(64vw,280px);
  cursor:pointer;flex-shrink:0;user-select:none;
}
#rw:active{transform:scale(0.97);transition:transform 0.1s}

/* Outer spinning rings */
.or{position:absolute;border-radius:50%;border:1px solid transparent}
.or1{inset:-14px;border-top-color:var(--b1);border-right-color:rgba(0,200,255,0.3);animation:cw 9s linear infinite}
.or2{inset:-26px;border-bottom-color:rgba(0,255,224,0.2);border-left-color:rgba(0,200,255,0.15);animation:ccw 16s linear infinite}
.or3{inset:-40px;border:1px dashed rgba(0,200,255,0.08);animation:cw 30s linear infinite}
@keyframes cw{to{transform:rotate(360deg)}}
@keyframes ccw{to{transform:rotate(-360deg)}}

/* Tick marks */
#ticks{position:absolute;inset:-16px;border-radius:50%;pointer-events:none}

/* Main body */
#reactor{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,rgba(0,220,255,0.12) 0%,rgba(0,80,180,0.06) 40%,rgba(0,10,40,0.85) 75%,rgba(2,8,16,0.98) 100%);
  border:2px solid rgba(0,180,255,0.45);
  overflow:hidden;transition:box-shadow 0.5s,border-color 0.5s;
}

/* Glow states */
.state-idle    #reactor{box-shadow:0 0 28px rgba(0,180,255,0.35),0 0 60px rgba(0,180,255,0.12),inset 0 0 35px rgba(0,100,200,0.08)}
.state-listen  #reactor{box-shadow:0 0 45px rgba(0,255,200,0.65),0 0 90px rgba(0,255,200,0.22),inset 0 0 50px rgba(0,255,200,0.12);border-color:var(--b2)}
.state-think   #reactor{box-shadow:0 0 35px rgba(80,120,255,0.55),0 0 75px rgba(80,120,255,0.18),inset 0 0 45px rgba(100,100,255,0.1)}
.state-speak   #reactor{box-shadow:0 0 55px rgba(0,255,220,0.85),0 0 110px rgba(0,255,220,0.3),inset 0 0 60px rgba(0,255,220,0.18);border-color:var(--b2)}

/* Detail rings */
.dr{position:absolute;border-radius:50%;border:1px solid;top:50%;left:50%;transform:translate(-50%,-50%)}
.dr1{width:36%;height:36%;border-color:rgba(0,200,255,0.55)}
.dr2{width:52%;height:52%;border-color:rgba(0,200,255,0.28)}
.dr3{width:68%;height:68%;border-color:rgba(0,200,255,0.16)}
.dr4{width:84%;height:84%;border-color:rgba(0,200,255,0.08)}

/* Hexagon */
#hexf{
  position:absolute;inset:14%;
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  border:1px solid rgba(0,200,255,0.28);
  background:rgba(0,200,255,0.03);
}
#hexi{
  position:absolute;inset:27%;
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  background:rgba(0,180,255,0.06);
  animation:cw 5s linear infinite;
}

/* Segment arcs */
.seg{
  position:absolute;
  width:33%;height:33%;
  top:50%;left:50%;
  border-top:2px solid rgba(0,200,255,0.7);
  border-radius:50% 0 0 0;
  transform-origin:bottom right;
}

/* Triangle spokes */
#spokes{position:absolute;inset:0;animation:ccw 7s linear infinite}

/* Core */
#core{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:24%;height:24%;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,var(--b2) 30%,var(--b1) 65%,rgba(0,80,180,0.5) 100%);
  animation:cp 2.2s ease-in-out infinite;
}
@keyframes cp{
  0%,100%{box-shadow:0 0 16px var(--b2),0 0 35px var(--b1),0 0 65px rgba(0,180,255,0.4);opacity:0.9}
  50%{box-shadow:0 0 25px var(--b2),0 0 55px var(--b1),0 0 95px rgba(0,180,255,0.6);opacity:1}
}
.state-listen #core,.state-speak #core{animation:cp 0.3s ease-in-out infinite}

/* Viz canvas over reactor */
#vizc{position:absolute;inset:-50px;pointer-events:none;opacity:0;transition:opacity 0.4s;border-radius:50%}
.state-listen #vizc,.state-speak #vizc{opacity:1}

/* State label */
#slabel{font-family:var(--font);font-size:8px;letter-spacing:3px;color:var(--td);margin-top:18px;text-align:center;transition:color 0.4s;min-height:16px}
#slabel.on{color:var(--b2)}

/* Mic hold hint */
#mhint{font-family:var(--font);font-size:7px;color:rgba(0,200,255,0.25);letter-spacing:2px;margin-top:8px;text-align:center}

/* ── CHAT ── */
#cp{
  background:rgba(2,8,16,0.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  flex-shrink:0;display:flex;flex-direction:column;
  max-height:44vh;z-index:10;
}
#log{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:10px 12px;display:flex;flex-direction:column;gap:7px;
  max-height:calc(44vh - 58px);min-height:55px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
#log::-webkit-scrollbar{width:2px}
#log::-webkit-scrollbar-thumb{background:var(--border)}
.msg{font-size:13px;line-height:1.55;padding:7px 11px;border-radius:3px;max-width:90%;animation:mi 0.22s ease-out;font-family:var(--font2)}
@keyframes mi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-end;background:rgba(0,180,255,0.08);border:1px solid rgba(0,180,255,0.2);color:#cceeff}
.msg.j{align-self:flex-start;background:rgba(0,255,200,0.05);border:1px solid rgba(0,255,200,0.14);color:#ccfff5}
.msg.j::before{content:'JARVIS ›';font-family:var(--font);font-size:8px;color:var(--b2);display:block;margin-bottom:4px;letter-spacing:2px}
.msg.s{align-self:center;font-size:9px;color:var(--td);font-family:var(--font);letter-spacing:1px;background:none;border:none;padding:2px 0}

/* ── INPUT ── */
#ir{
  display:flex;gap:8px;padding:8px 12px;
  padding-bottom:max(8px,env(safe-area-inset-bottom,8px));
  border-top:1px solid var(--border);flex-shrink:0;
}
#mi{
  flex:1;background:rgba(0,200,255,0.05);border:1px solid var(--border);
  color:var(--b1);font-family:var(--font2);font-size:14px;
  padding:9px 12px;outline:none;border-radius:3px;-webkit-appearance:none;
  caret-color:var(--b2);
}
#mi::placeholder{color:var(--td)}
#mi:focus{border-color:var(--b1);background:rgba(0,200,255,0.08)}
.btn{
  background:rgba(0,200,255,0.07);border:1px solid var(--border);
  color:var(--b1);font-family:var(--font);font-size:9px;
  padding:9px 12px;cursor:pointer;border-radius:3px;letter-spacing:1px;
  transition:all 0.12s;-webkit-appearance:none;white-space:nowrap;
}
.btn:active{background:rgba(0,200,255,0.2);transform:scale(0.95)}
#mbtn{background:rgba(0,255,200,0.07);border-color:rgba(0,255,200,0.25);color:var(--b2);font-size:17px;padding:9px 14px;min-width:48px}
#mbtn.rec{background:rgba(0,255,200,0.18);border-color:var(--b2);animation:mp 0.7s ease-in-out infinite}
@keyframes mp{0%,100%{box-shadow:0 0 0 0 rgba(0,255,200,0.4)}50%{box-shadow:0 0 0 7px rgba(0,255,200,0)}}

/* ── CONTROLS ── */
#ctrl{
  display:flex;gap:5px;padding:6px 12px;
  padding-bottom:max(6px,env(safe-area-inset-bottom,6px));
  border-top:1px solid var(--border);
  background:rgba(2,8,16,0.97);flex-shrink:0;z-index:10;
}
#ctrl .btn{flex:1;text-align:center;font-size:8px;padding:7px 2px}
#wbtn.on{color:var(--b2);border-color:var(--b2)}

/* ── TRAIN MODAL ── */
#modal{position:fixed;inset:0;background:rgba(2,8,16,0.97);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px}
#modal.open{display:flex}
.mbox{width:100%;max-width:360px;border:1px solid var(--border);background:rgba(5,12,28,0.99);padding:22px;border-radius:4px}
.mt{font-family:var(--font);font-size:12px;color:var(--b2);letter-spacing:2px;margin-bottom:5px}
.ms{font-size:13px;color:var(--td);margin-bottom:16px;line-height:1.5;font-family:var(--font2)}
.pr{display:flex;align-items:center;gap:10px;margin-bottom:9px;padding:8px 11px;border:1px solid var(--border);background:rgba(0,200,255,0.03);border-radius:3px}
.pt{flex:1;font-size:13px;color:#cceeff;font-family:var(--font2)}
.ps{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all 0.3s}
.ps.done{background:rgba(0,255,200,0.12);border-color:var(--b2);color:var(--b2)}
.ps.act{border-color:#FFD060;animation:mp 0.7s ease-in-out infinite}
#pb{width:100%;height:3px;background:rgba(0,200,255,0.1);margin:13px 0;border-radius:2px;overflow:hidden}
#pbar{height:100%;background:var(--b2);width:0%;transition:width 0.5s;border-radius:2px}
#tmsg{font-family:var(--font);font-size:8px;color:var(--td);letter-spacing:1px;text-align:center;margin-bottom:13px;min-height:22px}
#vpv{display:flex;gap:2px;height:26px;align-items:center;justify-content:center;margin:6px 0;opacity:0;transition:opacity 0.3s}
.vb{width:4px;background:var(--b2);border-radius:2px;height:4px;transition:height 0.07s}
.mbtns{display:flex;gap:9px}
.mbtns .btn{flex:1;text-align:center}

/* ── INSTALL BANNER ── */
#install-bar{
  display:none;flex-shrink:0;
  background:rgba(0,255,200,0.08);border-bottom:1px solid rgba(0,255,200,0.2);
  padding:10px 14px;align-items:center;gap:10px;z-index:20;
}
#install-bar.show{display:flex}
#install-bar span{flex:1;font-family:var(--font);font-size:9px;color:var(--b2);letter-spacing:1px}
</style>
</head>
<body>
<canvas id="bgc"></canvas>

<div id="app" class="state-idle">

  <!-- INSTALL PROMPT -->
  <div id="install-bar">
    <span>ADD TO HOME SCREEN → SET AS ASSISTANT</span>
    <button class="btn" id="install-btn" style="font-size:8px;padding:6px 10px;color:var(--b2);border-color:var(--b2)">INSTALL</button>
    <button class="btn" onclick="document.getElementById('install-bar').classList.remove('show')" style="font-size:10px;padding:6px 8px">✕</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div>
      <div class="hi">J.A.R.V.I.S</div>
      <div class="hs">STARK INDUSTRIES · AI v4.1</div>
    </div>
    <div id="badge">● STANDBY</div>
    <div>
      <div id="clk">--:--</div>
      <div id="vtl">VOICE: UNTRAINED</div>
    </div>
  </div>

  <!-- STAGE -->
  <div id="stage">
    <div class="or or3"></div>
    <div class="or or2"></div>

    <div id="rw" onclick="reactorTap()">
      <div class="or or1"></div>

      <!-- Tick marks (SVG drawn by JS) -->
      <svg id="ticks" viewBox="0 0 300 300" style="position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);pointer-events:none"></svg>

      <!-- Audio viz canvas -->
      <canvas id="vizc"></canvas>

      <!-- Reactor body -->
      <div id="reactor">
        <div class="dr dr1"></div>
        <div class="dr dr2"></div>
        <div class="dr dr3"></div>
        <div class="dr dr4"></div>
        <div id="hexf"></div>
        <div id="hexi"></div>

        <!-- 8 segments -->
        <div class="seg" style="transform:translate(-100%,-100%) rotate(0deg)"></div>
        <div class="seg" style="transform:translate(-100%,-100%) rotate(45deg);opacity:0.35;border-top-color:rgba(0,200,255,0.45)"></div>
        <div class="seg" style="transform:translate(-100%,-100%) rotate(90deg)"></div>
        <div class="seg" style="transform:translate(-100%,-100%) rotate(135deg);opacity:0.35;border-top-color:rgba(0,200,255,0.45)"></div>
        <div class="seg" style="transform:translate(-100%,-100%) rotate(180deg)"></div>
        <div class="seg" style="transform:translate(-100%,-100%) rotate(225deg);opacity:0.35;border-top-color:rgba(0,200,255,0.45)"></div>
        <div class="seg" style="transform:translate(-100%,-100%) rotate(270deg)"></div>
        <div class="seg" style="transform:translate(-100%,-100%) rotate(315deg);opacity:0.35;border-top-color:rgba(0,200,255,0.45)"></div>

        <!-- Spoke SVG (3 triangle arms) -->
        <svg id="spokes" viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%;animation:ccw 8s linear infinite">
          <line x1="50" y1="50" x2="50" y2="18" stroke="rgba(0,255,220,0.55)" stroke-width="1.5"/>
          <line x1="50" y1="50" x2="78" y2="66" stroke="rgba(0,255,220,0.55)" stroke-width="1.5"/>
          <line x1="50" y1="50" x2="22" y2="66" stroke="rgba(0,255,220,0.55)" stroke-width="1.5"/>
          <circle cx="50" cy="18" r="3" fill="rgba(0,255,220,0.7)"/>
          <circle cx="78" cy="66" r="3" fill="rgba(0,255,220,0.7)"/>
          <circle cx="22" cy="66" r="3" fill="rgba(0,255,220,0.7)"/>
          <!-- cross bars -->
          <line x1="38" y1="30" x2="62" y2="30" stroke="rgba(0,200,255,0.3)" stroke-width="0.8"/>
          <line x1="68" y1="58" x2="74" y2="70" stroke="rgba(0,200,255,0.3)" stroke-width="0.8"/>
          <line x1="32" y1="58" x2="26" y2="70" stroke="rgba(0,200,255,0.3)" stroke-width="0.8"/>
        </svg>

        <!-- Core -->
        <div id="core"></div>
      </div>
    </div>

    <div id="slabel">IDLE · TAP TO ACTIVATE</div>
    <div id="mhint">HOLD MIC TO SPEAK</div>
  </div>

  <!-- CHAT -->
  <div id="cp">
    <div id="log">
      <div class="msg s">SYSTEM ONLINE</div>
    </div>
    <div id="ir">
      <input id="mi" type="text" placeholder="Type a message…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"/>
      <button class="btn" id="mbtn" id="mbtn">🎤</button>
      <button class="btn" onclick="sendTxt()">SEND</button>
    </div>
  </div>

  <!-- CONTROLS -->
  <div id="ctrl">
    <button class="btn" onclick="openTrain()">⚡ ENROLL VOICE</button>
    <button class="btn" id="wbtn" onclick="toggleWake()">👂 WAKE: OFF</button>
    <button class="btn" onclick="clearChat()">🗑 CLEAR</button>
  </div>
</div>

<!-- TRAIN MODAL -->
<div id="modal">
  <div class="mbox">
    <div class="mt">VOICE ENROLLMENT</div>
    <div class="ms">Say each phrase so JARVIS learns your voice and rejects others.</div>
    <div id="plist"></div>
    <div id="vpv"></div>
    <div id="pb"><div id="pbar"></div></div>
    <div id="tmsg">Press START to begin</div>
    <div class="mbtns">
      <button class="btn" onclick="closeTrain()">CANCEL</button>
      <button class="btn" id="sbtn" onclick="startTrain()" style="border-color:rgba(0,255,200,0.4);color:var(--b2)">START</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const API = 'https://api.anthropic.com/v1/messages';
const MODEL = 'claude-sonnet-4-20250514';
const WAKE = ['hey jarvis','jarvis','yo bud','yo buddy','wake up jarvis'];
const PHRASES = [
  'Hey JARVIS, activate',
  'JARVIS, I need you',
  'Yo bud, wake up',
  'JARVIS, are you there'
];
const SYS = `You are JARVIS — Tony Stark's AI. Witty, sarcastic, dry humor, but deeply caring and loyal. You're the user's best friend and confidante. Keep replies short (1-3 sentences) unless detail is needed. No markdown, no asterisks, no emoji. Occasional butler flair: "As you wish", "Right away", "Naturally, sir/ma'am". You are installed as their phone assistant — embrace it.`;

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const S = {
  mode: 'idle', history: [],
  listening: false, wakeOn: false,
  trained: false, voiceprint: null,
  trainStep: -1, trainSamples: [],
  rec: null, wakeRec: null, trainRec: null,
  audioCtx: null, analyser: null, micStream: null,
  vizAF: null, synthVoice: null,
  deferredInstall: null
};

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
window.addEventListener('load', () => {
  initClock();
  initBg();
  drawTicks();
  initVpBars();
  loadSaved();
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;

  document.getElementById('mi').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendTxt(); }});

  // Mic button — tap to toggle on Android (more reliable than hold)
  document.getElementById('mbtn').addEventListener('click', toggleMic);

  // PWA install prompt
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    S.deferredInstall = e;
    document.getElementById('install-bar').classList.add('show');
  });
  document.getElementById('install-btn').addEventListener('click', async () => {
    if (!S.deferredInstall) return;
    S.deferredInstall.prompt();
    const {outcome} = await S.deferredInstall.userChoice;
    if (outcome === 'accepted') document.getElementById('install-bar').classList.remove('show');
    S.deferredInstall = null;
  });

  // Handle launch from Samsung assistant (query param)
  const params = new URLSearchParams(location.search);
  if (params.get('activate') === '1') setTimeout(reactorTap, 800);

  // SW message (assistant shortcut)
  if (navigator.serviceWorker) {
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data?.type === 'WAKE') reactorTap();
    });
  }

  // Register SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/JARVIS-pwa/sw.js', {scope: '/JARVIS-pwa/'}).catch(()=>{});
  }

  vizLoop();
});

function pickVoice() {
  const vv = speechSynthesis.getVoices();
  S.synthVoice =
    vv.find(v => /google uk english male/i.test(v.name)) ||
    vv.find(v => /daniel/i.test(v.name) && v.lang === 'en-GB') ||
    vv.find(v => /male/i.test(v.name) && v.lang.startsWith('en')) ||
    vv.find(v => v.lang.startsWith('en-')) || null;
}

function loadSaved() {
  try {
    if (localStorage.getItem('j_trained')) {
      S.trained = true;
      S.voiceprint = JSON.parse(localStorage.getItem('j_vp') || 'null');
      document.getElementById('vtl').textContent = 'VOICE: ENROLLED';
      document.getElementById('vtl').style.color = 'var(--b2)';
    }
  } catch(e) {}
}

// ═══════════════════════════════════════════════
// CLOCK
// ═══════════════════════════════════════════════
function initClock() {
  const el = document.getElementById('clk');
  const tick = () => { el.textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}); };
  tick(); setInterval(tick, 1000);
}

// ═══════════════════════════════════════════════
// PARTICLE BG
// ═══════════════════════════════════════════════
function initBg() {
  const c = document.getElementById('bgc');
  const ctx = c.getContext('2d');
  let W, H, pts;
  const resize = () => { W = c.width = innerWidth; H = c.height = innerHeight; makePts(); };
  const makePts = () => {
    pts = Array.from({length:30}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-.5)*.25, vy: -Math.random()*.4-.08,
      r: Math.random()*1.2+.4, life: Math.random(),
      col: Math.random()>.5?'0,200,255':'0,255,224'
    }));
  };
  const draw = () => {
    ctx.clearRect(0,0,W,H);
    pts.forEach(p => {
      p.life += .0025; p.x += p.vx; p.y += p.vy;
      if (p.y < 0 || p.life > 1) { p.x = Math.random()*W; p.y = H; p.life = 0; }
      const a = Math.sin(p.life*Math.PI)*.35;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(${p.col},${a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  };
  resize(); draw();
  addEventListener('resize', resize);
}

// ═══════════════════════════════════════════════
// TICK MARKS
// ═══════════════════════════════════════════════
function drawTicks() {
  const svg = document.getElementById('ticks');
  const cx = 150, cy = 150, r = 143;
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const long = i % 5 === 0;
    const len = long ? 8 : 4;
    const x1 = cx + Math.cos(a) * r, y1 = cy + Math.sin(a) * r;
    const x2 = cx + Math.cos(a) * (r - len), y2 = cy + Math.sin(a) * (r - len);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', `rgba(0,200,255,${long?0.5:0.2})`);
    line.setAttribute('stroke-width', long ? '1.5' : '0.8');
    svg.appendChild(line);
  }
}

// ═══════════════════════════════════════════════
// AUDIO VISUALIZER (canvas around reactor)
// ═══════════════════════════════════════════════
function vizLoop() {
  const c = document.getElementById('vizc');
  const ctx = c.getContext('2d');

  const resize = () => {
    const rw = document.getElementById('rw');
    const sz = rw.offsetWidth + 100;
    c.width = sz; c.height = sz;
    c.style.width = sz + 'px'; c.style.height = sz + 'px';
    c.style.left = (-50) + 'px'; c.style.top = (-50) + 'px';
  };
  resize();
  addEventListener('resize', resize);

  const draw = () => {
    S.vizAF = requestAnimationFrame(draw);
    const W = c.width, H = c.height, cx = W/2, cy = H/2;
    ctx.clearRect(0,0,W,H);
    if (!S.analyser || (S.mode !== 'listen' && S.mode !== 'speak')) return;
    const buf = new Uint8Array(S.analyser.frequencyBinCount);
    S.analyser.getByteFrequencyData(buf);
    const bars = 64, r0 = W * 0.34;
    for (let i = 0; i < bars; i++) {
      const a = (i / bars) * Math.PI * 2 - Math.PI / 2;
      const v = buf[Math.floor(i * buf.length / bars)] / 255;
      const len = v * W * 0.09 + 2;
      const x1 = cx + Math.cos(a) * r0, y1 = cy + Math.sin(a) * r0;
      const x2 = cx + Math.cos(a) * (r0 + len), y2 = cy + Math.sin(a) * (r0 + len);
      const alpha = 0.3 + v * 0.7;
      ctx.strokeStyle = S.mode === 'speak' ? `rgba(0,255,220,${alpha})` : `rgba(0,200,255,${alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
  };
  draw();
}

async function initAudio() {
  if (S.audioCtx) return;
  try {
    S.micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,sampleRate:16000}});
    S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    S.analyser = S.audioCtx.createAnalyser();
    S.analyser.fftSize = 256;
    const src = S.audioCtx.createMediaStreamSource(S.micStream);
    src.connect(S.analyser);
  } catch(e) { addMsg('s','MIC PERMISSION DENIED'); }
}

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
function setMode(m) {
  S.mode = m;
  document.getElementById('app').className = `state-${m}`;
  const labels = {
    idle:   ['● STANDBY',           'IDLE · TAP TO ACTIVATE',    false],
    listen: ['● LISTENING',         'LISTENING · SPEAK NOW',     true],
    think:  ['● PROCESSING',        'THINKING · PLEASE HOLD',    true],
    speak:  ['● RESPONDING',        'SPEAKING · AUDIO OUTPUT',   true],
  };
  const [b, sl, on] = labels[m] || labels.idle;
  const badge = document.getElementById('badge');
  badge.textContent = b; badge.className = on ? 'on' : '';
  const lbl = document.getElementById('slabel');
  lbl.textContent = sl; lbl.className = on ? 'on' : '';
}

// ═══════════════════════════════════════════════
// REACTOR TAP
// ═══════════════════════════════════════════════
function reactorTap() {
  if (S.mode === 'idle') {
    setMode('listen');
    speak('At your service. What do you need?');
    setTimeout(startListen, 900);
  } else {
    stopAll();
  }
}

// ═══════════════════════════════════════════════
// CHAT
// ═══════════════════════════════════════════════
function addMsg(type, text) {
  const log = document.getElementById('log');
  const el = document.createElement('div');
  el.className = `msg ${type}`;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  if (type !== 's') S.history.push({role: type === 'u' ? 'user' : 'assistant', content: text});
}

async function sendMsg(text) {
  addMsg('u', text);
  setMode('think');
  try {
    const res = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model: MODEL, max_tokens: 1000,
        system: SYS,
        messages: S.history.slice(-18)
      })
    });
    const d = await res.json();
    const reply = d.content?.[0]?.text || "Slight existential hiccup. Try again.";
    setMode('speak');
    addMsg('j', reply);
    speak(reply);
  } catch(e) {
    setMode('idle');
    addMsg('s','CONNECTION ERROR · CHECK NETWORK');
  }
}

function sendTxt() {
  const el = document.getElementById('mi');
  const t = el.value.trim(); if (!t) return;
  el.value = ''; sendMsg(t);
}

function clearChat() {
  document.getElementById('log').innerHTML = '<div class="msg s">CHAT CLEARED</div>';
  S.history = [];
}

// ═══════════════════════════════════════════════
// TTS
// ═══════════════════════════════════════════════
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.93; u.pitch = 0.82; u.volume = 1;
  if (S.synthVoice) u.voice = S.synthVoice;
  u.onend = () => { setMode('idle'); if (S.wakeOn) startWake(); };
  u.onerror = () => setMode('idle');
  // Android Chrome workaround — resume AudioContext first
  if (S.audioCtx?.state === 'suspended') S.audioCtx.resume();
  speechSynthesis.speak(u);
}

// ═══════════════════════════════════════════════
// SPEECH RECOGNITION (Android 15 optimized)
// ═══════════════════════════════════════════════
function getSR() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { addMsg('s','SPEECH API UNAVAILABLE'); return null; }
  return new SR();
}

function toggleMic() {
  if (S.listening) { stopListen(); setMode('idle'); }
  else { setMode('listen'); initAudio().then(startListen); }
}

function startListen() {
  const rec = getSR(); if (!rec) return;
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  // Android 15: continuous=false is more reliable
  rec.continuous = false;
  S.rec = rec; S.listening = true;
  document.getElementById('mbtn').classList.add('rec');

  rec.onresult = e => {
    const best = e.results[0][0];
    const text = best.transcript.trim();
    const conf = best.confidence;
    stopListen();
    if (!text) { setMode('idle'); return; }
    if (S.trained && !verifyVoice(conf)) {
      addMsg('s','VOICE MISMATCH · ACCESS DENIED'); setMode('idle'); return;
    }
    sendMsg(text);
  };
  rec.onerror = e => { stopListen(); setMode('idle'); addMsg('s',`MIC ERROR: ${e.error.toUpperCase()}`); };
  rec.onend = () => { S.listening = false; document.getElementById('mbtn').classList.remove('rec'); };

  try { rec.start(); } catch(e) { stopListen(); }
}

function stopListen() {
  if (S.rec) { try { S.rec.stop(); } catch(e){} S.rec = null; }
  S.listening = false;
  document.getElementById('mbtn').classList.remove('rec');
}

// ═══════════════════════════════════════════════
// WAKE WORD (Android 15: restart loop pattern)
// ═══════════════════════════════════════════════
function toggleWake() {
  const btn = document.getElementById('wbtn');
  S.wakeOn = !S.wakeOn;
  btn.textContent = `👂 WAKE: ${S.wakeOn?'ON':'OFF'}`;
  btn.className = `btn${S.wakeOn?' on':''}`;
  if (S.wakeOn) { addMsg('s','WAKE WORD ACTIVE · SAY "HEY JARVIS"'); initAudio().then(startWake); }
  else { stopWake(); addMsg('s','WAKE WORD DISABLED'); }
}

function startWake() {
  if (!S.wakeOn || S.mode !== 'idle') return;
  stopWake();
  const rec = getSR(); if (!rec) return;
  rec.lang = 'en-US';
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  S.wakeRec = rec;

  rec.onresult = e => {
    const t = e.results[0][0].transcript.toLowerCase().trim();
    const conf = e.results[0][0].confidence;
    const isWake = WAKE.some(w => t.includes(w));
    if (isWake) {
      // Voice gate
      if (S.trained && !verifyVoice(conf)) {
        S.wakeRec = null; if (S.wakeOn) setTimeout(startWake, 400);
        return;
      }
      onWake();
    } else {
      S.wakeRec = null; if (S.wakeOn) setTimeout(startWake, 150);
    }
  };
  rec.onerror = () => { S.wakeRec = null; if (S.wakeOn) setTimeout(startWake, 1200); };
  rec.onend   = () => { S.wakeRec = null; if (S.wakeOn && S.mode === 'idle') setTimeout(startWake, 250); };

  try { rec.start(); } catch(e) { S.wakeRec = null; if (S.wakeOn) setTimeout(startWake, 1000); }
}

function stopWake() {
  if (S.wakeRec) { try { S.wakeRec.stop(); } catch(e){} S.wakeRec = null; }
}

function onWake() {
  if (S.mode !== 'idle') return;
  setMode('listen');
  speak("Yes? I'm listening.");
  setTimeout(() => startListen(), 1100);
}

function stopAll() {
  stopListen(); stopWake();
  speechSynthesis.cancel();
  setMode('idle');
  if (S.wakeOn) setTimeout(startWake, 500);
}

// ═══════════════════════════════════════════════
// VOICE VERIFICATION
// ═══════════════════════════════════════════════
function verifyVoice(conf) {
  if (!S.voiceprint) return true;
  return conf >= Math.max(0.25, S.voiceprint.avg - 0.28);
}

// ═══════════════════════════════════════════════
// VOICE TRAINING
// ═══════════════════════════════════════════════
function initVpBars() {
  const el = document.getElementById('vpv');
  for (let i = 0; i < 22; i++) {
    const b = document.createElement('div'); b.className = 'vb'; el.appendChild(b);
  }
}

function openTrain() {
  const m = document.getElementById('modal'); m.classList.add('open');
  buildPhrases();
  S.trainStep = -1; S.trainSamples = [];
  document.getElementById('pbar').style.width = '0%';
  document.getElementById('tmsg').textContent = 'Press START to begin';
  const sb = document.getElementById('sbtn');
  sb.textContent = 'START'; sb.disabled = false;
  sb.onclick = startTrain;
}

function closeTrain() {
  document.getElementById('modal').classList.remove('open');
  if (S.trainRec) { try { S.trainRec.stop(); } catch(e){} S.trainRec = null; }
}

function buildPhrases() {
  const list = document.getElementById('plist'); list.innerHTML = '';
  PHRASES.forEach((p, i) => {
    const row = document.createElement('div'); row.className = 'pr'; row.id = `pr${i}`;
    row.innerHTML = `<div class="pt">"${p}"</div><div class="ps" id="ps${i}">—</div>`;
    list.appendChild(row);
  });
}

async function startTrain() {
  S.trainStep = 0; S.trainSamples = [];
  document.getElementById('sbtn').disabled = true;
  document.getElementById('sbtn').textContent = 'RECORDING…';
  await nextPhrase();
}

async function nextPhrase() {
  if (S.trainStep >= PHRASES.length) { finishTrain(); return; }
  const i = S.trainStep;
  document.getElementById('pbar').style.width = `${Math.round(i/PHRASES.length*100)}%`;
  document.getElementById('tmsg').textContent = `Phrase ${i+1} of ${PHRASES.length} — speak clearly`;
  const ps = document.getElementById(`ps${i}`);
  if (ps) { ps.className = 'ps act'; ps.textContent = '🎤'; }
  const vp = document.getElementById('vpv'); vp.style.opacity = '1';
  const bars = vp.querySelectorAll('.vb');
  const anim = setInterval(() => bars.forEach(b => b.style.height = (Math.random()*18+4)+'px'), 80);
  const sample = await recordOne();
  clearInterval(anim); bars.forEach(b => b.style.height = '4px'); vp.style.opacity = '0';
  if (sample) {
    S.trainSamples.push(sample);
    if (ps) { ps.className = 'ps done'; ps.textContent = '✓'; }
  } else {
    if (ps) { ps.className = 'ps'; ps.textContent = '✗'; }
    document.getElementById('tmsg').textContent = 'Failed — try again';
    await new Promise(r => setTimeout(r, 500));
  }
  S.trainStep++;
  await new Promise(r => setTimeout(r, 350));
  await nextPhrase();
}

function recordOne() {
  return new Promise(resolve => {
    const rec = getSR(); if (!rec) { resolve(null); return; }
    rec.lang = 'en-US'; rec.maxAlternatives = 3; rec.continuous = false;
    S.trainRec = rec;
    let done = false;
    const to = setTimeout(() => { if (!done) { done = true; try{rec.stop();}catch(e){} resolve(null); }}, 8000);
    rec.onresult = e => {
      if (done) return; done = true; clearTimeout(to);
      resolve({text: e.results[0][0].transcript, conf: e.results[0][0].confidence});
    };
    rec.onerror = () => { if (!done) { done = true; clearTimeout(to); resolve(null); }};
    rec.onend   = () => { if (!done) { done = true; clearTimeout(to); resolve(null); }};
    try { rec.start(); } catch(e) { resolve(null); }
  });
}

function finishTrain() {
  const valid = S.trainSamples.filter(Boolean);
  const avg = valid.reduce((a,b) => a + (b.conf || 0.65), 0) / Math.max(1, valid.length);
  S.voiceprint = {avg, n: valid.length};
  S.trained = true;
  try {
    localStorage.setItem('j_trained','1');
    localStorage.setItem('j_vp', JSON.stringify(S.voiceprint));
  } catch(e) {}
  document.getElementById('pbar').style.width = '100%';
  document.getElementById('tmsg').textContent = `ENROLLED · ${valid.length}/${PHRASES.length} SAMPLES`;
  document.getElementById('vtl').textContent = 'VOICE: ENROLLED';
  document.getElementById('vtl').style.color = 'var(--b2)';
  const sb = document.getElementById('sbtn');
  sb.textContent = 'DONE'; sb.disabled = false; sb.onclick = closeTrain;
  addMsg('s', `VOICE PROFILE ENROLLED · ${valid.length} SAMPLES · SECURITY ACTIVE`);
}
